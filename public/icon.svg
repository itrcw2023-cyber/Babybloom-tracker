<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Warm Rose to Glowing Sunset -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="35%" stop-color="#fecdd3" />
      <stop offset="75%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- App Icon Base Squircle Gradient -->
    <linearGradient id="appSquircleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="45%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Warm Amber / Gold Gradient for Heart -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Glow Drop Shadow -->
    <filter id="appShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#881337" flood-opacity="0.28" />
    </filter>
    
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- App Icon Base Container (Rounded Squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#appSquircleGrad)" />

  <!-- Subtle Rim Light Inner Border -->
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.4" />

  <!-- Soft Ambient Glow Circle Behind Mother and Baby -->
  <circle cx="256" cy="256" r="190" fill="#ffffff" fill-opacity="0.15" />
  <circle cx="256" cy="256" r="155" fill="#ffffff" fill-opacity="0.95" filter="url(#appShadow)" />

  <!-- Mother and Baby Vector Artwork -->
  <g transform="translate(64, 56) scale(3.8)" filter="url(#innerGlow)">
    <!-- Mother Head -->
    <circle cx="47" cy="26" r="12.5" fill="#e11d48" />

    <!-- Mother Flowing Hair Profile -->
    <path
      d="M 37 22 C 35 33, 28 43, 21 54 C 19 59, 21 64, 25 66 C 29 67, 33 64, 35 59 C 39 49, 41 40, 41 32 Z"
      fill="#be123c"
    />

    <!-- Mother Caring Torso / Protective Arc -->
    <path
      d="M 38 35 C 28 47, 22 63, 23 77 C 24 85, 31 90, 42 90 C 56 90, 71 86, 80 77 C 85 72, 84 65, 79 61 C 74 57, 68 61, 62 66 C 53 72, 44 73, 39 67 C 36 63, 36 55, 42 44 C 46 38, 44 34, 38 35 Z"
      fill="#e11d48"
    />

    <!-- Mother's Arm Swaddling and Cradling Baby -->
    <path
      d="M 44 45 C 52 42, 63 46, 71 52 C 77 56, 79 64, 76 70 C 73 76, 67 80, 60 80 C 53 80, 48 76, 46 70 C 44 64, 48 59, 54 58 C 59 57, 65 59, 67 64"
      stroke="#e11d48"
      stroke-width="5.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- Sleeping Baby Head -->
    <circle cx="58" cy="51" r="8.5" fill="#f43f5e" />

    <!-- Baby Closed Sleeping Eyelashes -->
    <path
      d="M 55 52.5 Q 57 54.5 59 52.5"
      stroke="#ffffff"
      stroke-width="1.6"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Swaddle Blanket Soft Fold -->
    <path
      d="M 64 56 C 68 60, 69 66, 66 71"
      stroke="#fda4af"
      stroke-width="2.5"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Golden Little Heart Accent Above Embrace -->
    <path
      d="M 69 19 C 69 16, 72 14, 75 14 C 77 14, 79 15, 80 17 C 81 15, 83 14, 85 14 C 88 14, 91 16, 91 19 C 91 23, 84 28, 80 31 C 76 28, 69 23, 69 19 Z"
      fill="url(#goldAccent)"
    />
  </g>

  <!-- Blooming Petals / Sparkles around border -->
  <circle cx="110" cy="110" r="8" fill="#ffffff" fill-opacity="0.6" />
  <circle cx="390" cy="115" r="6" fill="#fef08a" fill-opacity="0.8" />
  <circle cx="410" cy="380" r="7" fill="#ffffff" fill-opacity="0.5" />
  <circle cx="95" cy="390" r="5" fill="#ffffff" fill-opacity="0.5" />
</svg>
